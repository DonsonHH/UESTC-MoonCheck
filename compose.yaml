services:
  moonuestc:
    image: "${MOON_IMAGE:-ghcr.io/horoscope963852/moonuestc:0.5.1}"
    user: "${PUID:-10001}:${PGID:-10001}"
    command: ["serve"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${MOON_BIND_ADDRESS:-127.0.0.1}:${MOON_PORT:-8088}:8080"
    environment:
      TZ: Asia/Shanghai
      MOON_CONFIG: /config/config.json
      MOON_DATA: /data
      MOON_PUBLIC_URL: "${MOON_PUBLIC_URL:?Set MOON_PUBLIC_URL in .env}"
      MOON_ALLOW_INSECURE_HTTP: "${MOON_ALLOW_INSECURE_HTTP:-0}"
      MOON_ALLOW_REGISTRATION: "${MOON_ALLOW_REGISTRATION:-1}"
      MOON_ENABLE_PORTAL: "${MOON_ENABLE_PORTAL:-0}"
      MOON_ENABLE_WECHAT_AUTH: "${MOON_ENABLE_WECHAT_AUTH:-0}"
      MOON_SURFACE: "${MOON_SURFACE:-}"
      MOON_REQUIRE_CONSENT: "${MOON_REQUIRE_CONSENT:-1}"
      MOON_STUDENT_ID_PREFIX: "${MOON_STUDENT_ID_PREFIX:-}"
      MOON_ALLOWED_PRESETS: "${MOON_ALLOWED_PRESETS:-}"
      MOON_RUN_WINDOW: "${MOON_RUN_WINDOW:-21:06,23:24}"
      MOON_TRUSTED_PROXY_CIDRS: "${MOON_TRUSTED_PROXY_CIDRS:-}"
      MOON_BROWSER_ASSIST_URL: "${MOON_BROWSER_ASSIST_URL:-}"
      MOON_BROWSER_ASSIST_KEY: "${MOON_BROWSER_ASSIST_KEY:-}"
    volumes:
      - type: bind
        source: "${MOON_DATA_DIR:-./data}"
        target: /data
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
