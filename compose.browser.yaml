services:
  moonuestc:
    depends_on:
      school-browser:
        condition: service_healthy
  school-browser:
    image: "${MOON_BROWSER_IMAGE:-moonuestc-browser:local}"
    container_name: moonuestc-browser
    runtime: runc
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BROWSER_ASSIST_KEY: "${MOON_BROWSER_ASSIST_KEY:?Set a private browser service key}"
      HOME: /tmp/browser-home
    mem_limit: 768m
    pids_limit: 256
    shm_size: 128m
    tmpfs: ["/tmp:size=512m,mode=1777"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
