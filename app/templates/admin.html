<section id="view-admin" class="view hidden">
  <div class="page-heading"><h1>系统管理</h1><button class="secondary" id="admin-refresh">{{ icon('refresh-cw') }}刷新</button></div>
  <div class="panel admin-registration"><div><h2>开放注册</h2><p class="muted small">关闭后，已有用户仍可登录。</p></div><label class="switch"><input id="registration-enabled" type="checkbox" aria-label="开放注册"><span></span></label></div>
  <div class="section-title"><h2>用户</h2></div><div class="panel history-panel"><table class="admin-users-table"><thead><tr><th>用户名</th><th>角色</th><th>打卡账号</th><th>注册时间</th><th>状态</th></tr></thead><tbody id="admin-users"></tbody></table></div>
  <div class="section-title admin-presets-title"><h2>预设位置</h2><button class="primary" id="new-preset">{{ icon('plus') }}添加预设</button></div><div id="admin-presets" class="panel"></div>
</section>
<dialog id="preset-dialog" aria-labelledby="preset-title"><form id="preset-form">
  <div class="dialog-heading"><h2 id="preset-title">添加预设</h2><button type="button" class="icon-button close-preset" aria-label="关闭预设窗口">{{ icon('x') }}</button></div>
  <input type="hidden" name="id"><label>名称<input name="name" required maxlength="60" placeholder="如：某校区某栋宿舍"></label>
  <div class="two-cols"><label>纬度<input name="latitude" type="number" step="any" min="-90" max="90" required></label><label>经度<input name="longitude" type="number" step="any" min="-180" max="180" required></label></div>
  <div class="two-cols"><label>坐标系<select name="coordinate_system"><option value="gcj02">GCJ-02</option><option value="wgs84">WGS84</option></select></label><label>精度（米）<input name="accuracy" type="number" step="any" min="0" max="100000" value="50" required></label></div>
  <label class="checkbox"><input name="enabled" type="checkbox" checked>启用此预设</label><p class="field-hint">修改后，使用此预设的账号将同步更新位置。</p><p id="preset-error" class="form-error hidden" role="alert"></p>
  <div class="dialog-footer"><button type="button" class="secondary close-preset">取消</button><button type="submit" class="primary">保存</button></div>
</form></dialog>
