services:
  moon-admin:
    image: "${MOON_IMAGE:?Set the reviewed MoonUESTC image}"
    user: "${PUID:-10001}:${PGID:-10001}"
    command: ["serve"]
    runtime: runc
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:${MOON_ADMIN_PORT:-4497}:8080"]
    environment:
      TZ: Asia/Shanghai
      MOON_DATA: /data
      MOON_PUBLIC_URL: "http://127.0.0.1:${MOON_ADMIN_PORT:-4497}"
      MOON_STUDENT_PUBLIC_URL: "${MOON_PUBLIC_URL:?Set the student public URL}"
      MOON_ALLOW_INSECURE_HTTP: "1"
      MOON_ALLOW_REGISTRATION: "0"
      MOON_ENABLE_PORTAL: "1"
      MOON_ENABLE_WECHAT_AUTH: "${MOON_ENABLE_WECHAT_AUTH:-0}"
      MOON_SURFACE: admin
      MOON_REQUIRE_CONSENT: "${MOON_REQUIRE_CONSENT:-1}"
      MOON_STUDENT_ID_PREFIX: "${MOON_STUDENT_ID_PREFIX:-}"
      MOON_ALLOWED_PRESETS: "${MOON_ALLOWED_PRESETS:-}"
      MOON_RUN_WINDOW: "${MOON_RUN_WINDOW:-21:06,23:24}"
    volumes:
      - type: bind
        source: "${MOON_DATA_DIR:-./data}"
        target: /data
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 384m
    pids_limit: 64
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
